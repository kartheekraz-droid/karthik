<svg width="56" height="56" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Compensation calculator">
  <circle cx="28" cy="28" r="27" fill="#ecefff" stroke="#000080" stroke-width="1.4"/>

  <!-- balance beam -->
  <line x1="14" y1="20" x2="42" y2="20" stroke="#000080" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="17" x2="28" y2="40" stroke="#000080" stroke-width="2" stroke-linecap="round"/>

  <!-- left pan (holds the land value) -->
  <line x1="16" y1="20" x2="12" y2="29" stroke="#000080" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="16" y1="20" x2="20" y2="29" stroke="#000080" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M11 29c0 3 3.5 5 5.5 5s5.5-2 5.5-5" fill="none" stroke="#c56a00" stroke-width="1.8" stroke-linecap="round"/>

  <!-- right pan (holds the solatium) -->
  <line x1="40" y1="20" x2="36" y2="29" stroke="#000080" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="40" y1="20" x2="44" y2="29" stroke="#000080" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M35 29c0 3 3.5 5 5.5 5s5.5-2 5.5-5" fill="none" stroke="#0b5c05" stroke-width="1.8" stroke-linecap="round"/>

  <!-- base -->
  <path d="M22 41h12l3 5H19z" fill="#000080"/>
  <rect x="24" y="39.5" width="8" height="2.2" rx="1" fill="#000080"/>

  <!-- rupee mark -->
  <text x="28" y="16" text-anchor="middle" font-family="Georgia, 'Noto Serif', serif" font-size="11" font-weight="700" fill="#c56a00">₹</text>
</svg>
